name: AIDLC PR Reviewer Ping

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  assign-and-notify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Assign reviewer owner
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: ['csackrider'],
            });

      - name: Add mention comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- aidlc-reviewer-ping -->';
            const body = `${marker}
            @csackrider this PR is ready for your review.`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const alreadyCommented = comments.some(c => c.body && c.body.includes(marker));
            if (alreadyCommented) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
